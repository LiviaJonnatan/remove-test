server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. With the API's address in a variable, nginx looks it up per request instead of
    # once at startup, so the page still loads (and shows an error) when api-service is down.
    resolver 127.0.0.11 valid=10s;
    set $api http://api-service:8000;

    # /api/rules/... reaches the API as /rules/...: the browser only ever talks to this origin,
    # so the API needs no CORS setup and the built files hold no API address.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location / {
        try_files $uri /index.html;
    }
}
