[project]
name = "data-collector"
version = "0.1.0"
description = "Pull comments and attachments for Regulations.gov dockets."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "google-cloud-storage>=2.10",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]