[project]
name = "outcome-graph"
version = "0.1.0"
description = "The outcome record as a graph: who asked EPA for what, what EPA said, and what changed in the final rule."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2,<2",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.2",
    "firebase-admin>=6.5",
    "anthropic[vertex]>=0.70",
    "httpx>=0.27",
    "google-cloud-texttospeech>=2.16",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
