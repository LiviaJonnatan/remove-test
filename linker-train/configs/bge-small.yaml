# The encoder rule-passages serves today. A tuned copy replaces it with no code change.
base_model: BAAI/bge-small-en-v1.5
epochs: 4
batch_size: 32
hard_negatives: 3
lr: 3.0e-5
warmup: 0.1
weight_decay: 0.01
scale: 20.0
max_seq_length: 384
remine_each_epoch: true
val_share: 0.1
seed: 13
grad_chunk: 16
