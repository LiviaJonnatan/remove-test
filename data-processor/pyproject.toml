[project]
name = "data-processor"
version = "0.1.0"
description = "Convert collector records into canonical letters with extraction provenance."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
